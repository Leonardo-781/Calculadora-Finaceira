<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juros</title>
    <!-- CSS only -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="js/funcao.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <header>
        <div id="Centralizar" class="bg-danger">

            <button class="btn btn-danger" id="btt"> <a  onclick='AbrirDivJurosSimples()'> Juros Simples</a></button>

        </div>
       
    </header>
    <main>
        <div id="DivJurosSimples" style="display: block">
            <div id="ValorFuturo">
                <h3>Deseja descobrir valor Futuro ? </h3>
                <input type="number" name="VF_vp" id="VF_vp" placeholder="Valor Presente">
                <input type="number" name="VF_i" id="VF_i" placeholder="Valor da Taxa">
                <input type="number" name="VF_n" id="VF_n" placeholder="Valor do Tempo">
                <button class="btn"onclick="Calc_VF()">=</button>
                 <label for="VF_vf">R$ </label>
                <input type="number" name="VF_vf" id="VF_vf" disabled> <hr>
            </div>

            <div id="ValorDosJuros">
                <h3>Deseja descobrir Valor dos Juros? </h3>
                <div>
                    <input type="number" name="VJ_vf" id="VJ_vf" placeholder="Valor Futuro">
                    <input type="number" name="VJ_vp" id="VJ_vp" placeholder="Valor Presente">
                    <button class="btn" onclick="Calc_VJ1()">=</button>
                    <label for="Vj_vj1">R$ </label>
                   <input type="number" name="Vj_vj1" id="Vj_vj1" disabled>
                </div>


                <div>
                    <input type="number" name="VJ_vp2" id="VJ_vp2" placeholder="Valor Presente">
                    <input type="number" name="VJ_i" id="VJ_i" placeholder="Taxa">
                    <input type="number" name="VJ_t" id="VJ_t" placeholder="Tempo">
                    <button class="btn" onclick="Calc_VJ2()">=</button>
                     <label for="Vj_vj2">R$ </label>
                    <input type="number" name="Vj_vj2" id="Vj_vj2" disabled> <hr>
                </div>
                
            </div>

            <div id="ValorPresente">
                <h3>Deseja descobrir Valor Presente? </h3>
                <div>
                    <input type="number" name="VP_vf" id="VP_vf" placeholder="Valor Futuro">
                    <input type="number" name="VP_i" id="VP_i" placeholder="Taxa">
                    <input type="number" name="VP_n" id="VP_n" placeholder="tempo">
                    <button class="btn" onclick="Calc_VP1()">=</button>
                    <label for="VP_vp1">R$ </label>
                   <input type="number" name="VP_vp1" id="VP_vp1" disabled>
                </div>


                <div>
                    <input type="number" name="VP_vj" id="VP_vj" placeholder="Juros">
                    <input type="number" name="VP_i2" id="VP_i2" placeholder="Taxa">
                    <input type="number" name="VP_t" id="VP_t" placeholder="Tempo">
                    <button class="btn" onclick="Calc_VP2()">=</button>
                     <label for="VP_vp2">R$ </label>
                    <input type="number" name="VP_vp2" id="VP_vp2" disabled> <hr>
                </div>
                
            </div>

            <div id="Taxa">
                <h3>Deseja descobrir Taxa? </h3>
                <div>
            
                    <input type="number" name="I_vf" id="I_vf" placeholder="Valor Futuro">
                    <input type="number" name="I_vp" id="I_vp" placeholder="Valor Presente">
                    <input type="number" name="I_n" id="I_n" placeholder="Tempo">
                    <button class="btn" onclick="Calc_Taxa1()">=</button>
                   <input type="number" name="I_i1" id="I_i1" disabled>
                   <label for="I_i1">%</label>
                </div>


                <div>
                    <input type="number" name="I_j" id="I_j" placeholder="Juros">
                    <input type="number" name="I_vp" id="I_vp" placeholder="Valor Presente">
                    <input type="number" name="I_n" id="I_n" placeholder="Tempo">
                    <button class="btn" onclick="Calc_Taxa2()">=</button> 
                    <input type="number" name="I_i2" id="I_i2" disabled> 
                    <label for="I_i2">%</label><hr>
                </div>
                
            </div>

            <div id="Tempo">
                <h3>Deseja descobrir Tempo? </h3>
                <div>
            
                    <input type="number" name="T_vf" id="T_vf" placeholder="Valor Futuro">
                    <input type="number" name="T_vp1" id="T_vp1" placeholder="Valor Presente">
                    <input type="number" name="T_i" id="T_i" placeholder="Taxa">
                    <button class="btn" onclick="Calc_Tempo1()">=</button>
                   <input type="number" name="T_t1" id="T_t1" disabled>
                   <label for="T_t1">N</label>
                </div>
                

                <div>
                    <input type="number" name="T_j" id="T_j" placeholder="Juros">
                    <input type="number" name="T_vp2" id="T_vp2" placeholder="Valor Presente">
                    <input type="number" name="T_i2" id="T_i2" placeholder="Taxa">
                    <button class="btn" onclick="Calc_Tempo2()">=</button> 
                    <input type="number" name="T_t2" id="T_t2" disabled> 
                    <label for="T_t2">N</label><hr>
                </div>
                
            </div>

        </div>
    </main>
    <footer></footer>

    <!-- JS, Popper.js, and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
        integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
        crossorigin="anonymous"></script>


</body>

</html>
